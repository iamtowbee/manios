<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curds.io - Pixel Toon Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="title-screen">
            <h1>🧀 CURDS.IO 🧀</h1>
            <p class="subtitle">A Pixel Toon Adventure</p>
            <button id="start-btn">Start Game</button>
            <div class="controls-info">
                <p>Arrow Keys / WASD: Move</p>
                <p>SPACE / ENTER: Interact</p>
            </div>
        </div>

        <div id="game-screen" style="display: none;">
            <canvas id="game-canvas"></canvas>

            <div id="ui-overlay">
                <div class="player-info">
                    <span id="player-name">Player</span>
                    <span id="location-info"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="tangui.js"></script>
    <script src="game.js"></script>
</body>
</html>
