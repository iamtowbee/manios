<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanGui - Basic Example</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #app {
            width: 100%;
            max-width: 1200px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        // This is a mock example showing how TanGui would be used
        // In production, you'd import from the built library

        console.log('🎮 TanGui Basic Example');
        console.log('This demonstrates TanGui component usage');

        // Initialize demo UI
        const app = document.getElementById('app');

        // Create demo container
        const demoContainer = document.createElement('div');
        demoContainer.style.cssText = `
            background: #1A1A2E;
            border: 4px solid #FFD700;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.5);
        `;

        // Title
        const title = document.createElement('h1');
        title.textContent = '🧀 TanGui Demo';
        title.style.cssText = `
            color: #FFD700;
            font-size: 32px;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0px #000;
        `;
        demoContainer.appendChild(title);

        // Demo sections
        const sections = [
            {
                title: 'Buttons',
                description: 'Interactive buttons with variants and sizes',
            },
            {
                title: 'Cards',
                description: 'Container components with elevation',
            },
            {
                title: 'Input Fields',
                description: 'Text inputs with validation states',
            },
            {
                title: 'Dialogue Box',
                description: 'Typewriter effect with choices',
            },
            {
                title: 'HUD',
                description: 'Health bars and game stats',
            },
            {
                title: 'Menu',
                description: 'Keyboard-navigable game menus',
            },
        ];

        sections.forEach(section => {
            const sectionEl = document.createElement('div');
            sectionEl.style.cssText = `
                background: #16213E;
                border: 2px solid #667EEA;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
            `;

            const sectionTitle = document.createElement('h2');
            sectionTitle.textContent = section.title;
            sectionTitle.style.cssText = `
                color: #667EEA;
                font-size: 16px;
                margin-bottom: 10px;
            `;

            const sectionDesc = document.createElement('p');
            sectionDesc.textContent = section.description;
            sectionDesc.style.cssText = `
                color: #B8C1EC;
                font-size: 10px;
                line-height: 1.6;
            `;

            sectionEl.appendChild(sectionTitle);
            sectionEl.appendChild(sectionDesc);
            demoContainer.appendChild(sectionEl);
        });

        // Instructions
        const instructions = document.createElement('div');
        instructions.style.cssText = `
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #FFD700;
            border-radius: 8px;
            text-align: center;
        `;
        instructions.innerHTML = `
            <p style="color: #FFD700; font-size: 12px; margin-bottom: 10px;">
                ✨ Getting Started
            </p>
            <p style="color: #B8C1EC; font-size: 10px; line-height: 1.6;">
                Import TanGui components and start building!<br>
                See the TypeScript examples in the /examples directory.
            </p>
        `;
        demoContainer.appendChild(instructions);

        app.appendChild(demoContainer);

        console.log('📦 TanGui components ready:');
        console.log('- Box, Text, Stack (VStack, HStack, ZStack)');
        console.log('- Button, Card, Input');
        console.log('- DialogueBox, HUD, Menu');
    </script>
</body>
</html>
